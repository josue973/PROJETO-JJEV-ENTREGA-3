<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJEV Vendas Online - Criar Conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <header class="logo-area">
            <h1>JJEV</h1>
            <p>VENDAS ONLINE</p>
        </header>
        
        <form class="cadastro-form">
            <h2>Criar Nova Conta</h2>
            
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
            </div>
            
            <div class="input-group">
                <label for="email-cadastro">E-mail</label>
                <input type="email" id="email-cadastro" placeholder="Digite seu melhor e-mail" required>
            </div>
            
            <div class="input-group">
                <label for="senha-cadastro">Senha</label>
                <input type="password" id="senha-cadastro" placeholder="Crie uma senha forte" required>
            </div>

            <div class="input-group">
                <label for="senha-confirma">Confirmar Senha</label>
                <input type="password" id="senha-confirma" placeholder="Digite a senha novamente" required>
            </div>
            
            <button type="submit" class="btn-primary">Finalizar Cadastro</button>
            
            <div class="signup-link">
                Já tem uma conta? <a href="index.html">Voltar para o Login</a>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
